name: Publish Booked demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: booked-demo-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check static-app.js
          node --check demo.js
          node --check marketing.js
          node --check calendar.js
          node --check mockup-model.js
          node --check mockup-studio.js
          node --check design-system.js
          node --check home-art-3d.js
          node --check home-presentation.js
          node --check meeting-model.js
          node --check meeting-workspace.js
          node --check message-calendar.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4
